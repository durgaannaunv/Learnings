<center>
    <h1>Student Details</h1>
    <input type="text" id="studentData" placeholder="enter the student details in json" style="width: 300px;height: 100px;">
    <button onclick="addStudentDetails()">Add Student</button>
</center>

<div class="studentContainer">
    <h2>Student Roaster</h2>
    <div id="studentDetails">

    </div>

</div>

<script>
    var Students = [{
        "RollNo" : "0001",
        "StudentName" : "Durga",
        "Course" : "Biology",
        "Marks" : "1119"
    },
    {
        "RollNo" : "0002",
        "StudentName" : "Raji",
        "Course" : "Biology",
        "Marks" : "1120"
    }
    ]

    function renderStudentDetails(studentarraydata)
    {
        var studentDetails=document.getElementById("studentDetails");
        studentDetails.innerHTML="";    
        for(var i=0;i<studentarraydata.length;i++)
    {
        var student = studentarraydata[i];

        studentDetails.innerHTML += `<div id="studentContainer">
            <b>${student.StudentName}</b>
             <div id="details"><b>RollNo : </b> ${student.RollNo}</div>
             <div id="details">
                <b>Course : </b> ${student.Course} | <b>Marks : </b> ${student.Marks}
                </div>
                <br>
        </div>`;


        

    }
        

    }

    function addStudentDetails()
    {
        console.log("inside the function")
        var studentInputData = document.getElementById("studentData");
        var studentData =studentInputData.value;

        try{
        var studentobj=JSON.parse(studentData)
        Students.push(studentobj);
        renderStudentDetails(Students);
        studentInputData.value="";
        }
        catch(error)
        {
            alert("Please verify the json provided")

        }

        


        
    }

    window.onload = function() {
        renderStudentDetails(Students);
    };
</script>
